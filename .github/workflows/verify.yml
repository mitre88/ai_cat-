name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Linux (package tests, syntax, shadow type-check)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Python for the validators
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip >/dev/null
          pip3 install --break-system-packages --quiet openstep_parser
      - name: Validate project, plists and string catalogs
        run: python3 Tools/validate_project.py
      - name: Build and test AICatCore, parse and type-check the app
        run: Tools/verify_linux.sh

  macos:
    name: macOS (package tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test (AICatCore)
        run: cd Packages/AICatCore && swift test

  ios-app:
    name: iOS app (simulator build, Xcode 26 on the runner, Duo off)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | grep -i "simulator" || true
      - name: Build for the iOS simulator (AICAT_DUO off; needs Xcode 26+, otherwise skipped)
        run: |
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "${MAJOR:-0}" -lt 26 ]; then echo "Xcode $MAJOR < 26 (iOS 26 SDK needed): app build skipped"; exit 0; fi
          xcodebuild build -project AICat.xcodeproj -scheme AICat -destination "generic/platform=iOS Simulator" \
            -derivedDataPath /tmp/aicat-dd \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG' CODE_SIGNING_ALLOWED=NO > /tmp/xcodebuild.log 2>&1 || true
          echo "=== distinct errors ==="
          grep -E "error:" /tmp/xcodebuild.log | sed -E 's#^.*/(AICat/|Packages/|Config/)#\1#' | sort -u | head -150
          grep -E "\*\* BUILD (SUCCEEDED|FAILED) \*\*" /tmp/xcodebuild.log | tail -1
          grep -q "BUILD SUCCEEDED" /tmp/xcodebuild.log
          echo "=== distinct warnings (first 60) ==="
          grep -E "warning:" /tmp/xcodebuild.log | sed -E 's#^.*/(AICat/|Packages/|Config/)#\1#' | sort -u | head -60 || true
      - name: Launch in the simulator (-AICatSmoke) and wait for the home world to render
        run: Tools/simulator_smoke.sh /tmp/aicat-dd/Build/Products/Debug-iphonesimulator/AICat.app 150
